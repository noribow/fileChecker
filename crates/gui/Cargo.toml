[package]
name = "filechecker-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri GUI for File Checker (§10.14 screens; a thin layer over filechecker-core, see §10.13)"

[lib]
name = "filechecker_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "filechecker-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filechecker-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"
