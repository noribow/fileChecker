[package]
name = "filechecker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for File Checker (subset of GUI functionality, see requirements.md 10.13/10.16)"

[[bin]]
name = "filechecker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
filechecker-core = { workspace = true }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "2", features = ["zstd", "deflate"] }
