[package]
name = "filechecker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core logic for File Checker (integrity check / duplicate check)"

[lib]
name = "filechecker_core"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.1"
digest = "0.11.3"
md-5 = "0.11.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
walkdir = "2.5.0"

[dev-dependencies]
hex = "0.4.3"
tempfile = "3.27.0"
