[package]
name = "filechecker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core logic for File Checker (integrity check / duplicate check)"

[lib]
name = "filechecker_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
crc32fast = "1.5.1"
digest = "0.11.3"
flate2 = "1"
md-5 = "0.11.0"
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.22", features = ["zstd"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
zeroize = { version = "1", features = ["derive"] }
zip = { version = "2", features = ["zstd", "deflate"] }

[dev-dependencies]
hex = "0.4.3"
tempfile = "3.27.0"
